[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-hoard"
version = "0.1.0"
description = "A local paperwork keeper: reads invoices, contracts, policies, fines and letters, extracts the dates that matter, turns them into deadlines and reminds you, with a dashboard, notifications and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "pypdf[crypto]>=5",
  "pillow>=10.3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.18", "numpy>=1.26"]
windows = ["winotify>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
icon = ["pillow>=11", "numpy>=2"]

[project.scripts]
kafka-hoard = "kafka_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["kafka_hoard*"]

[tool.setuptools.package-data]
kafka_hoard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
