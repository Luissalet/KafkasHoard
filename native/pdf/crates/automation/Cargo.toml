[package]
name = "kafka-pdf-automation"
description = "Agent control for Kafka PDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kafka-pdf-engine = { workspace = true }
kafka-pdf-render = { workspace = true }
kafka-pdf-organize = { workspace = true }
serde_json = { workspace = true }
png = "0.18"
base64 = { version = "0.22", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
