[workspace]
resolver = "3"
members = ["crates/*", "host"]
exclude = ["vendor"]
default-members = ["host"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
kafka-pdf-geom = { path = "crates/geom", version = "0.2.0" }
kafka-pdf-filters = { path = "crates/filters", version = "0.2.0" }
kafka-pdf-cos = { path = "crates/cos", version = "0.2.0" }
kafka-pdf-crypt = { path = "crates/crypt", version = "0.2.0" }
kafka-pdf-organize = { path = "crates/organize", version = "0.2.0" }
kafka-pdf-annot = { path = "crates/annot", version = "0.2.0" }
kafka-pdf-fonts = { path = "crates/fonts", version = "0.2.0" }
kafka-pdf-model = { path = "crates/model", version = "0.2.0" }
kafka-pdf-content = { path = "crates/content", version = "0.2.0" }
kafka-pdf-redact = { path = "crates/redact", version = "0.2.0" }
kafka-pdf-print = { path = "crates/print", version = "0.2.0" }
kafka-pdf-xfdf = { path = "crates/xfdf", version = "0.2.0" }
kafka-pdf-sign = { path = "crates/sign", version = "0.2.0" }
kafka-pdf-optimize = { path = "crates/optimize", version = "0.2.0" }
kafka-pdf-a11y = { path = "crates/a11y", version = "0.2.0" }
kafka-pdf-ocr = { path = "crates/ocr", version = "0.2.0" }
kafka-pdf-js = { path = "crates/js", version = "0.2.0" }
kafka-pdf-compare = { path = "crates/compare", version = "0.2.0" }
kafka-pdf-preflight = { path = "crates/preflight", version = "0.2.0" }
kafka-pdf-export = { path = "crates/export", version = "0.2.0" }
kafka-pdf-edit = { path = "crates/edit", version = "0.2.0" }
kafka-pdf-create = { path = "crates/create", version = "0.2.0" }
kafka-pdf-forms = { path = "crates/forms", version = "0.2.0" }
kafka-pdf-render = { path = "crates/render", version = "0.2.0" }
kafka-pdf-engine = { path = "crates/engine", version = "0.2.0" }
kafka-pdf-automation = { path = "crates/automation", version = "0.2.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
